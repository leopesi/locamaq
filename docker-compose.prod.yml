version: '3.8'

services:
  web:
    image: ghcr.io/leopesi/locamaq:latest
    container_name: locamaq-web
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs
    restart: unless-stopped
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/accounts/login/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: locamaq-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    restart: unless-stopped

volumes:
  sqlite_data:
  media_data:
  static_data:
  logs_data:
