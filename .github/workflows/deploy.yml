name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1
  EKS_CLUSTER: bittar-hml
  NAMESPACE: locamaq
  DJANGO_SETTINGS_MODULE: config.settings.prod

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Testes e Validação
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar .env
        run: |
          cp .env.example .env
          echo "SECRET_KEY=ci-test-secret-key-not-for-production-use" >> .env

      - name: Verificar configuração Django
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Executar migrations
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Rodar testes
        run: python manage.py test --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

  # ─────────────────────────────────────────────
  # JOB 2: Build Docker + Push GitHub Container Registry
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build e Push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # ─────────────────────────────────────────────
  # JOB 3: Deploy no EKS
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER \
            --region $AWS_REGION

      - name: Criar namespace (se não existir)
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar imagePullSecret para GHCR
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --namespace=$NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifests K8s
        run: |
          kubectl apply -f k8s/ -n $NAMESPACE

      - name: Atualizar imagem do deployment
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::8}"
          kubectl set image deployment/locamaq \
            locamaq=$IMAGE \
            -n $NAMESPACE
          echo "🚀 Deploying: $IMAGE"

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/locamaq \
            -n $NAMESPACE \
            --timeout=300s

      - name: Verificar pods
        run: |
          kubectl get pods -n $NAMESPACE
          echo ""
          echo "✅ Deploy concluído!"

      - name: Executar migrations (post-deploy)
        run: |
          POD=$(kubectl get pods -n $NAMESPACE -l app=locamaq -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $POD -n $NAMESPACE -- python manage.py migrate --noinput
