name: CI/CD — Build & Deploy (Hostinger)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Testes e Validação
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar .env
        run: |
          cp .env.example .env
          echo "SECRET_KEY=ci-test-secret-key-not-for-production-use" >> .env

      - name: Verificar configuração Django
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Executar migrations
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Rodar testes
        run: python manage.py test --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

  # ─────────────────────────────────────────────
  # JOB 2: Build Docker + Push GHCR
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # ─────────────────────────────────────────────
  # JOB 3: Deploy via SSH na Hostinger
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Hostinger (SSH)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/locamaq

            echo "📥 Pulling latest image..."
            docker pull ghcr.io/leopesi/locamaq:latest

            echo "🔄 Restarting containers..."
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d

            echo "🗃️ Running migrations..."
            docker exec locamaq-web python manage.py migrate --noinput

            echo "📦 Collecting static files..."
            docker exec locamaq-web python manage.py collectstatic --noinput

            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo "✅ Deploy concluído!"
            docker ps | grep locamaq
