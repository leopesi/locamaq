<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LocaMaq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg shadow-blue-600/20">🏗️</div>
                <h1 class="text-2xl font-bold text-slate-800">LocaMaq</h1>
                <p class="text-slate-500 text-sm mt-1">Gestão de Locação de Máquinas</p>
            </div>

            {% if form.errors %}
            <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl mb-6 text-sm flex items-center gap-2">
                <span>❌</span> Usuário ou senha inválidos.
            </div>
            {% endif %}

            <form method="post" action="{% url 'accounts:login' %}" class="space-y-5">
                {% csrf_token %}
                <input type="hidden" name="next" value="/dashboard/">

                <div>
                    <label for="id_username" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Usuário</label>
                    <input type="text" name="username" id="id_username" required autofocus
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition"
                        placeholder="Seu usuário">
                </div>

                <div>
                    <label for="id_password" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Senha</label>
                    <input type="password" name="password" id="id_password" required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition"
                        placeholder="Sua senha">
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 active:scale-[0.98] transition font-semibold text-sm shadow-lg shadow-blue-600/20">
                    Entrar
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-400 mt-6">
            <a href="/" class="hover:text-slate-600 transition">← Voltar ao site</a>
        </p>
    </div>
</body>
</html>
