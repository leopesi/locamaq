{% extends "base.html" %}

{% block title %}Enviar Mensagem — LocaMaq{% endblock %}

{% block content %}
<div class="max-w-lg">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Enviar Mensagem via WhatsApp</h1>

    <div class="bg-white rounded-lg shadow p-6">
        <p class="text-gray-600 mb-4">
            <strong>Para:</strong> {{ customer.name }} ({{ customer.whatsapp }})
        </p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mensagem</label>
                <textarea name="message" rows="5" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Digite a mensagem..."></textarea>
            </div>

            <div class="flex gap-3">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">📱 Enviar</button>
                <a href="{% url 'rentals:rental_detail' rental.pk %}" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400 transition">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
