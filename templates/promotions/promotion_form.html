{% extends "base.html" %}

{% block title %}{{ title }} — LocaMaq{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">{{ title }}</h1>

    <div class="bg-white rounded-lg shadow p-6">
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}

            <div class="flex gap-3 pt-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Criar Promoção</button>
                <a href="{% url 'promotions:promotion_list' %}" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400 transition">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
