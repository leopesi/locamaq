<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LocaMaq{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#64748b',
                    }
                }
            }
        }
    </script>
    <style>
        /* Mobile sidebar toggle */
        .sidebar-overlay { display: none; }
        .sidebar-overlay.active { display: block; }
        @media (max-width: 1023px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    {% if user.is_authenticated %}
    <!-- Mobile Header -->
    <header class="lg:hidden fixed top-0 left-0 right-0 bg-gray-900 text-white z-40 px-4 py-3 flex items-center justify-between">
        <button onclick="toggleSidebar()" class="text-2xl">☰</button>
        <h1 class="text-lg font-bold text-blue-400">🏗️ LocaMaq</h1>
        <a href="{% url 'accounts:logout' %}" class="text-red-400 text-sm">Sair</a>
    </header>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    {% include "partials/navbar.html" %}
    {% endif %}

    <main class="{% if user.is_authenticated %}lg:ml-64 pt-14 lg:pt-0{% endif %} p-4 md:p-6">
        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="p-4 rounded-lg mb-2 {% if message.tags == 'error' %}bg-red-100 text-red-700{% elif message.tags == 'success' %}bg-green-100 text-green-700{% else %}bg-blue-100 text-blue-700{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    {% if user.is_authenticated %}
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }
    </script>
    {% endif %}
</body>
</html>
