apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: locamaq-sqlite-pvc
  namespace: locamaq
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: locamaq-media-pvc
  namespace: locamaq
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp2
