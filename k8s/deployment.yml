apiVersion: apps/v1
kind: Deployment
metadata:
  name: locamaq
  namespace: locamaq
  labels:
    app: locamaq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: locamaq
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: locamaq
    spec:
      containers:
        - name: locamaq
          image: ECR_IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: locamaq-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
            - name: media-data
              mountPath: /app/media
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: locamaq-sqlite-pvc
        - name: media-data
          persistentVolumeClaim:
            claimName: locamaq-media-pvc
